<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Chat Room</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <!-- Join screen -->
  <section id="join-view" class="join-view">
    <form id="join-form" class="join-card" novalidate>
      <div class="logo" aria-hidden="true">💬</div>
      <h1>Chat Room</h1>
      <p class="muted">Pick a name to join the conversation.</p>
      <label for="name-input" class="sr-only">Your name</label>
      <input id="name-input" type="text" maxlength="24" placeholder="Your name"
             autocomplete="nickname" autocapitalize="words" spellcheck="false" required>
      <p id="join-error" class="error" role="alert" hidden></p>
      <button type="submit" id="join-button" class="primary">Join chat</button>
    </form>
  </section>

  <!-- Chat screen -->
  <section id="chat-view" class="chat-view" hidden>
    <header class="chat-header">
      <div class="title">
        <h1>💬 Chat Room</h1>
        <span id="status" class="status" data-state="connecting">Connecting…</span>
      </div>
      <div class="header-actions">
        <button type="button" id="users-toggle" class="ghost users-toggle" aria-controls="users-panel" aria-expanded="false">
          👥 <span id="user-count">0</span>
        </button>
        <button type="button" id="leave-button" class="ghost">Leave</button>
      </div>
    </header>

    <div class="chat-body">
      <main class="messages-wrap">
        <ol id="messages" class="messages" aria-live="polite" aria-label="Messages"></ol>
        <button type="button" id="jump-button" class="jump" hidden>New messages ↓</button>
      </main>
      <aside id="users-panel" class="users-panel" aria-label="People online">
        <h2>Online — <span id="user-count-panel">0</span></h2>
        <ul id="users" class="users"></ul>
      </aside>
    </div>

    <footer class="chat-footer">
      <div id="typing" class="typing" aria-live="polite"></div>
      <p id="send-error" class="error" role="alert" hidden></p>
      <form id="composer" class="composer">
        <label for="message-input" class="sr-only">Message</label>
        <textarea id="message-input" rows="1" maxlength="1000"
                  placeholder="Type a message… (Enter to send, Shift+Enter for a new line)"></textarea>
        <button type="submit" id="send-button" class="primary">Send</button>
      </form>
    </footer>
  </section>
</body>
</html>
