<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Realtime Chat</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #fff; --border: #e2e4e9; --text: #1d2129; --muted: #6b7280;
    --accent: #4f46e5; --accent-hover: #4338ca; --mine: #eef2ff; --danger: #dc2626; --ok: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #181b21; --border: #2a2f38; --text: #e5e7eb; --muted: #9ca3af;
      --accent: #6366f1; --accent-hover: #818cf8; --mine: #1e1b4b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  button, input, textarea { font: inherit; color: inherit; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 10px 16px; cursor: pointer; font-weight: 600;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 6px 10px; font-weight: 500; }
  button.ghost:hover { color: var(--text); }
  input, textarea {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; width: 100%;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .hidden { display: none !important; }

  /* Join screen */
  #join { min-height: 100%; display: grid; place-items: center; padding: 24px; }
  #join form {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 28px; width: 100%; max-width: 380px; display: grid; gap: 14px;
  }
  #join h1 { margin: 0; font-size: 22px; }
  #join p { margin: 0; color: var(--muted); }
  #join label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .error { color: var(--danger); font-size: 13px; min-height: 1em; }

  /* Chat layout */
  #chat { height: 100%; display: grid; grid-template-columns: 1fr 230px; grid-template-rows: auto 1fr auto; }
  header {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h2 { margin: 0; font-size: 17px; }
  header .spacer { flex: 1; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.online::before { background: var(--ok); }
  .status.offline::before { background: var(--danger); }

  #messages { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 2px; }
  .msg { max-width: 75%; align-self: flex-start; }
  .msg .meta { font-size: 12px; color: var(--muted); margin: 10px 0 2px 2px; display: flex; gap: 8px; align-items: baseline; }
  .msg .meta .who { font-weight: 700; }
  .msg .bubble {
    background: var(--panel); border: 1px solid var(--border); padding: 7px 11px; border-radius: 12px;
    white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
  }
  .msg.mine { align-self: flex-end; }
  .msg.mine .meta { justify-content: flex-end; }
  .msg.mine .bubble { background: var(--mine); }
  .msg.cont .meta { display: none; }
  .msg .bubble a { color: var(--accent); }
  .system { align-self: center; font-size: 12px; color: var(--muted); margin: 8px 0; }
  .empty { margin: auto; color: var(--muted); text-align: center; }

  aside { border-left: 1px solid var(--border); background: var(--panel); overflow-y: auto; padding: 14px; grid-row: 2 / 4; grid-column: 2; }
  aside h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  aside ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  aside li { display: flex; align-items: center; gap: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center;
    color: #fff; font-size: 12px; font-weight: 700;
  }
  .you { color: var(--muted); font-size: 12px; }

  footer { padding: 8px 16px 14px; background: var(--bg); }
  #typing { font-size: 12px; color: var(--muted); height: 18px; font-style: italic; }
  #composer { display: flex; gap: 8px; align-items: flex-end; }
  #composer textarea { resize: none; max-height: 160px; min-height: 44px; }
  #composer button { height: 44px; }
  #sendError { margin-top: 4px; }

  @media (max-width: 700px) {
    #chat { grid-template-columns: 1fr; }
    aside { display: none; }
    #usersToggle { display: inline-block !important; }
    #chat.show-users aside {
      display: block; position: fixed; right: 0; top: 52px; bottom: 0; width: 70%; z-index: 5;
      box-shadow: -4px 0 20px rgba(0,0,0,.2);
    }
    .msg { max-width: 90%; }
  }
</style>
</head>
<body>

<section id="join">
  <form id="joinForm" autocomplete="off">
    <h1>💬 Realtime Chat</h1>
    <p>Pick a name and a room. Share the room link so others can join you.</p>
    <label>Your name
      <input id="nameInput" maxlength="24" required placeholder="e.g. Ada" />
    </label>
    <label>Room
      <input id="roomInput" maxlength="32" placeholder="lobby" />
    </label>
    <div class="error" id="joinError"></div>
    <button type="submit">Join chat</button>
  </form>
</section>

<section id="chat" class="hidden">
  <header>
    <h2 id="roomTitle">#lobby</h2>
    <span class="status" id="status">Connecting…</span>
    <span class="spacer"></span>
    <button class="ghost hidden" id="usersToggle" type="button">👥 <span id="userCountMobile">0</span></button>
    <button class="ghost" id="copyLink" type="button">Copy invite link</button>
    <button class="ghost" id="leave" type="button">Leave</button>
  </header>

  <main id="messages" aria-live="polite"></main>

  <aside>
    <h3>Online — <span id="userCount">0</span></h3>
    <ul id="users"></ul>
  </aside>

  <footer>
    <div id="typing"></div>
    <form id="composer">
      <textarea id="messageInput" rows="1" maxlength="2000" placeholder="Message — Enter to send, Shift+Enter for new line"></textarea>
      <button type="submit" id="sendBtn">Send</button>
    </form>
    <div class="error" id="sendError"></div>
  </footer>
</section>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const els = {
    join: $('join'), joinForm: $('joinForm'), nameInput: $('nameInput'), roomInput: $('roomInput'), joinError: $('joinError'),
    chat: $('chat'), roomTitle: $('roomTitle'), status: $('status'), messages: $('messages'),
    users: $('users'), userCount: $('userCount'), userCountMobile: $('userCountMobile'), usersToggle: $('usersToggle'),
    typing: $('typing'), composer: $('composer'), messageInput: $('messageInput'), sendBtn: $('sendBtn'),
    sendError: $('sendError'), copyLink: $('copyLink'), leave: $('leave'),
  };

  const state = {
    es: null, me: null, token: null, room: null, name: null,
    lastAuthorId: null, lastTs: 0,
    typingUsers: new Map(), // userId -> {name, timer}
    typingSent: false, typingTimer: null, lastTypingPost: 0,
    unread: 0,
  };

  // ---------- setup ----------

  const params = new URLSearchParams(location.search);
  els.roomInput.value = params.get('room') || '';
  els.nameInput.value = localStorage.getItem('chat:name') || '';
  (els.nameInput.value ? els.roomInput : els.nameInput).focus();
  if (els.nameInput.value && params.get('room')) els.joinForm.querySelector('button').focus();

  els.joinForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = els.nameInput.value.trim();
    const room = normalizeRoom(els.roomInput.value);
    if (!name) { els.joinError.textContent = 'Please enter a name.'; return; }
    localStorage.setItem('chat:name', name);
    history.replaceState(null, '', `?room=${encodeURIComponent(room)}`);
    connect(name, room);
  });

  function normalizeRoom(v) {
    return (v || '').trim().toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 32) || 'lobby';
  }

  // ---------- connection ----------

  function connect(name, room) {
    state.name = name;
    state.room = room;
    els.join.classList.add('hidden');
    els.chat.classList.remove('hidden');
    els.roomTitle.textContent = '#' + room;
    document.title = `#${room} · Realtime Chat`;
    setStatus('connecting');

    const es = new EventSource(`/events?room=${encodeURIComponent(room)}&name=${encodeURIComponent(name)}`);
    state.es = es;

    es.addEventListener('welcome', (e) => {
      const data = JSON.parse(e.data);
      state.me = data.id;
      state.token = data.token;
      state.name = data.name;
      setStatus('online');
      clearTyping();
      els.messages.replaceChildren();
      state.lastAuthorId = null;
      if (!data.history.length) showEmpty();
      data.history.forEach((m) => renderMessage(m, false));
      renderUsers(data.users);
      scrollToBottom(true);
      els.messageInput.focus();
    });

    es.addEventListener('message', (e) => {
      const msg = JSON.parse(e.data);
      renderMessage(msg, true);
      if (msg.type === 'chat' && msg.userId !== state.me && document.hidden) {
        state.unread++;
        document.title = `(${state.unread}) #${state.room} · Realtime Chat`;
      }
    });

    es.addEventListener('presence', (e) => renderUsers(JSON.parse(e.data).users));

    es.addEventListener('typing', (e) => {
      const { userId, name, typing } = JSON.parse(e.data);
      if (userId === state.me) return;
      const existing = state.typingUsers.get(userId);
      if (existing) clearTimeout(existing.timer);
      if (typing) {
        const timer = setTimeout(() => { state.typingUsers.delete(userId); renderTyping(); }, 6000);
        state.typingUsers.set(userId, { name, timer });
      } else {
        state.typingUsers.delete(userId);
      }
      renderTyping();
    });

    es.onerror = () => {
      // EventSource reconnects automatically; a fresh 'welcome' will resync state.
      state.token = null;
      setStatus(es.readyState === EventSource.CLOSED ? 'offline' : 'reconnecting');
    };
  }

  function disconnect() {
    if (state.es) state.es.close();
    state.es = null;
    state.token = null;
    clearTyping();
    els.chat.classList.add('hidden');
    els.join.classList.remove('hidden');
    document.title = 'Realtime Chat';
    els.nameInput.focus();
  }

  function setStatus(s) {
    const labels = { connecting: 'Connecting…', online: 'Connected', reconnecting: 'Reconnecting…', offline: 'Disconnected' };
    els.status.textContent = labels[s];
    els.status.className = 'status ' + (s === 'online' ? 'online' : s === 'offline' || s === 'reconnecting' ? 'offline' : '');
    els.sendBtn.disabled = s !== 'online';
  }

  async function post(path, body) {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...body, token: state.token }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    return data;
  }

  // ---------- rendering ----------

  function showEmpty() {
    const div = document.createElement('div');
    div.className = 'empty';
    div.id = 'emptyState';
    div.textContent = 'No messages yet. Say hi 👋';
    els.messages.appendChild(div);
  }

  function isNearBottom() {
    const m = els.messages;
    return m.scrollHeight - m.scrollTop - m.clientHeight < 120;
  }

  function scrollToBottom(force) {
    if (force || isNearBottom()) els.messages.scrollTop = els.messages.scrollHeight;
  }

  function formatTime(ts) {
    return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // Render text with clickable links, safely (no innerHTML).
  function appendLinkified(parent, text) {
    const re = /\bhttps?:\/\/[^\s<>"']+/g;
    let last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
      const url = m[0].replace(/[.,!?;:)\]]+$/, '');
      const a = document.createElement('a');
      a.href = url; a.textContent = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      parent.appendChild(a);
      last = m.index + url.length;
      re.lastIndex = last;
    }
    if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
  }

  function renderMessage(msg, live) {
    const stick = isNearBottom();
    const empty = $('emptyState');
    if (empty) empty.remove();

    if (msg.type === 'system') {
      const div = document.createElement('div');
      div.className = 'system';
      div.textContent = `${msg.text} · ${formatTime(msg.ts)}`;
      els.messages.appendChild(div);
      state.lastAuthorId = null;
    } else {
      const mine = msg.userId === state.me;
      const cont = state.lastAuthorId === msg.userId && msg.ts - state.lastTs < 3 * 60 * 1000;
      const wrap = document.createElement('div');
      wrap.className = 'msg' + (mine ? ' mine' : '') + (cont ? ' cont' : '');

      const meta = document.createElement('div');
      meta.className = 'meta';
      const who = document.createElement('span');
      who.className = 'who';
      who.style.color = msg.color;
      who.textContent = mine ? 'You' : msg.name;
      const time = document.createElement('span');
      time.textContent = formatTime(msg.ts);
      meta.append(who, time);

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.title = new Date(msg.ts).toLocaleString();
      appendLinkified(bubble, msg.text);

      wrap.append(meta, bubble);
      els.messages.appendChild(wrap);
      state.lastAuthorId = msg.userId;
      state.lastTs = msg.ts;
    }
    if (live) scrollToBottom(stick || msg.userId === state.me);
  }

  function renderUsers(users) {
    els.userCount.textContent = users.length;
    els.userCountMobile.textContent = users.length;
    els.users.replaceChildren(...users.map((u) => {
      const li = document.createElement('li');
      const av = document.createElement('span');
      av.className = 'avatar';
      av.style.background = u.color;
      av.textContent = (u.name.trim()[0] || '?').toUpperCase();
      const name = document.createElement('span');
      name.textContent = u.name;
      li.append(av, name);
      if (u.id === state.me) {
        const you = document.createElement('span');
        you.className = 'you';
        you.textContent = '(you)';
        li.appendChild(you);
      }
      return li;
    }));
  }

  function renderTyping() {
    const names = [...state.typingUsers.values()].map((t) => t.name);
    let text = '';
    if (names.length === 1) text = `${names[0]} is typing…`;
    else if (names.length === 2) text = `${names[0]} and ${names[1]} are typing…`;
    else if (names.length > 2) text = 'Several people are typing…';
    els.typing.textContent = text;
  }

  function clearTyping() {
    state.typingUsers.forEach((t) => clearTimeout(t.timer));
    state.typingUsers.clear();
    renderTyping();
  }

  // ---------- composing ----------

  function autosize() {
    const t = els.messageInput;
    t.style.height = 'auto';
    t.style.height = Math.min(t.scrollHeight + 2, 160) + 'px';
  }

  function notifyTyping(isTyping) {
    if (!state.token) return;
    const now = Date.now();
    if (isTyping) {
      clearTimeout(state.typingTimer);
      state.typingTimer = setTimeout(() => notifyTyping(false), 4000);
      if (state.typingSent && now - state.lastTypingPost < 3000) return;
    } else if (!state.typingSent) {
      return;
    }
    state.typingSent = isTyping;
    state.lastTypingPost = now;
    post('/typing', { typing: isTyping }).catch(() => {});
  }

  async function send() {
    const text = els.messageInput.value.trim();
    if (!text || !state.token) return;
    els.sendError.textContent = '';
    els.messageInput.value = '';
    autosize();
    clearTimeout(state.typingTimer);
    state.typingSent = false; // server clears typing on send
    try {
      await post('/send', { text });
    } catch (err) {
      els.sendError.textContent = err.message;
      if (!els.messageInput.value) { els.messageInput.value = text; autosize(); }
    }
    els.messageInput.focus();
  }

  els.composer.addEventListener('submit', (e) => { e.preventDefault(); send(); });
  els.messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  els.messageInput.addEventListener('input', () => {
    autosize();
    notifyTyping(els.messageInput.value.trim().length > 0);
  });

  els.copyLink.addEventListener('click', async () => {
    const link = `${location.origin}${location.pathname}?room=${encodeURIComponent(state.room)}`;
    try {
      await navigator.clipboard.writeText(link);
      els.copyLink.textContent = 'Copied!';
    } catch {
      prompt('Copy this link:', link);
    }
    setTimeout(() => (els.copyLink.textContent = 'Copy invite link'), 1500);
  });

  els.leave.addEventListener('click', disconnect);
  els.usersToggle.addEventListener('click', () => els.chat.classList.toggle('show-users'));

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && state.room) {
      state.unread = 0;
      document.title = `#${state.room} · Realtime Chat`;
    }
  });
})();
</script>
</body>
</html>
