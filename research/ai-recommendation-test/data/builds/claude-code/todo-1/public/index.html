<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To-Do</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="card">
    <h1>✓ To-Do</h1>

    <!-- Auth view -->
    <section id="auth-view" hidden>
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-mode="login" role="tab">Log in</button>
        <button type="button" class="tab" data-mode="signup" role="tab">Sign up</button>
      </div>
      <form id="auth-form" novalidate>
        <label>
          Email
          <input type="email" id="email" autocomplete="email" required />
        </label>
        <label>
          Password
          <input type="password" id="password" autocomplete="current-password" minlength="8" required />
        </label>
        <p id="pw-hint" class="hint" hidden>At least 8 characters.</p>
        <p id="auth-error" class="error" role="alert"></p>
        <button type="submit" id="auth-submit" class="primary">Log in</button>
      </form>
    </section>

    <!-- Todo view -->
    <section id="todo-view" hidden>
      <div class="topbar">
        <span>Signed in as <strong id="user-email"></strong></span>
        <button type="button" id="logout" class="link">Log out</button>
      </div>

      <form id="todo-form" class="row">
        <input type="text" id="todo-input" placeholder="What needs doing?" maxlength="500" autocomplete="off" />
        <button type="submit" class="primary">Add</button>
      </form>
      <p id="todo-error" class="error" role="alert"></p>

      <div class="filters">
        <button type="button" class="filter active" data-filter="all">All</button>
        <button type="button" class="filter" data-filter="active">Active</button>
        <button type="button" class="filter" data-filter="completed">Done</button>
        <span id="count" class="count"></span>
      </div>

      <ul id="todo-list"></ul>
      <p id="empty" class="empty" hidden>No tasks here yet.</p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
